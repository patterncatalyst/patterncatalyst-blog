<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">{{ site.brand_emoji | default: "✍️" }}</span>
      <span>{{ site.title | default: "Blog" }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"
         {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/tag/cloud-native/' | relative_url }}">Tags</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://patterncatalyst.github.io/cloud-native-design-patterns/" rel="noopener">Hub ↗</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.github_repo }}"
         rel="noopener">GitHub ↗</a>
    </nav>
  </div>
</header>
