<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="40" width="840" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#888">Tier 1 · native gRPC over HTTP/2 — the book&#x27;s default, CI-gated every chapter</text>
<rect x="20" y="162" width="840" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="182" font-size="12" font-weight="700" fill="#888">Tier 2 · HTTP/3 as a transport, not gRPC — demonstrated, never gating</text>
<rect x="20" y="284" width="840" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="304" font-size="12" font-weight="700" fill="#888">Tier 3 · gRPC directly over HTTP/3 — a distinct binding, not shipped</text>
<rect x="55" y="80" width="210" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="160.0" y="106.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">grpc-java on Quarkus</text>
<text x="160.0" y="123.0" font-size="11.5" fill="#555555" text-anchor="middle">HTTP/2 · available</text>
<rect x="290" y="80" width="210" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="395.0" y="106.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">grpcio on Python</text>
<text x="395.0" y="123.0" font-size="11.5" fill="#555555" text-anchor="middle">HTTP/2 · available</text>
<rect x="560" y="80" width="270" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="106.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Every gRPC call in the book</text>
<text x="695.0" y="123.0" font-size="11.5" fill="#555555" text-anchor="middle">travels here</text>
<rect x="55" y="202" width="210" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Caddy</text>
<text x="160.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">auto HTTP/3 over TLS</text>
<rect x="290" y="202" width="210" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="395.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">aioquic probe</text>
<text x="395.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">QUIC handshake + h3 GET</text>
<rect x="560" y="202" width="270" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="228.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Proves the transport runs,</text>
<text x="695.0" y="245.0" font-size="11.5" fill="#555555" text-anchor="middle">never makes a gRPC call</text>
<rect x="55" y="324" width="210" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160.0" y="350.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">grpc-java</text>
<text x="160.0" y="367.0" font-size="11.5" fill="#555555" text-anchor="middle">no native h3 transport</text>
<rect x="290" y="324" width="210" height="56" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="395.0" y="350.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">grpcio</text>
<text x="395.0" y="367.0" font-size="11.5" fill="#555555" text-anchor="middle">no native h3 transport</text>
<rect x="560" y="324" width="270" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="695.0" y="350.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Not available in either stack</text>
<text x="695.0" y="367.0" font-size="11.5" fill="#555555" text-anchor="middle">as of January 2026</text>
</svg>