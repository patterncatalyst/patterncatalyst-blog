<text x="690.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">cheap storage, fast queries</text>
<rect x="45" y="196" width="330" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="210.0" y="222.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">http_requests_total</text>
