<text x="210.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">{ method, route, status }</text>
<rect x="540" y="82" width="300" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
