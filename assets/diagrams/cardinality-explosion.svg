<text x="440" y="34" font-size="11" fill="#888" text-anchor="middle" font-weight="700">One label decides whether a metric is cheap or ruinous</text>
<text x="440" y="300" font-size="13" fill="#6b6b6b" text-anchor="middle">The line of code looks identical at review time; the cardinality does not.</text>
