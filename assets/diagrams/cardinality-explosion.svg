<path d="M375,224 L540,224" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="463.5" y="218.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">unbounded</text>
