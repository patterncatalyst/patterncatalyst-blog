<rect x="540" y="196" width="300" height="56" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="690.0" y="222.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">millions of time series</text>
<text x="690.0" y="239.0" font-size="11.5" fill="#dddddd" text-anchor="middle">storage cost + slow dashboards</text>
<path d="M375,110 L540,110" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="463.5" y="104.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">enumerable</text>
