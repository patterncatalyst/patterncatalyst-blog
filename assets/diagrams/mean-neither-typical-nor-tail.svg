<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="70" width="880" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="90" font-size="12" font-weight="700" fill="#888">W (residence time) on the C++ consumer</text>
<rect x="50" y="110" width="180" height="95" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p50</text>
<text x="140.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">0.78 ms</text>
<text x="140.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">the typical parcel</text>
<rect x="280" y="110" width="200" height="95" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="380.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">W-bar (mean)</text>
<text x="380.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">1.05 ms</text>
<text x="380.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">the model input</text>
<rect x="530" y="110" width="160" height="95" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="610.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p99</text>
<text x="610.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">4.35 ms</text>
<text x="610.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle"></text>
<rect x="720" y="110" width="160" height="95" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="148.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">p99.9</text>
<text x="800.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">8.5 ms</text>
<text x="800.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">the tail</text>
<rect x="150" y="290" width="620" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="460.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Useless as a latency: neither the typical parcel nor the tail.</text>
<text x="460.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">Essential as L = lambda x W-bar: the only value that ties queue length to rate.</text>
<path d="M40,235 L880,235" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="1280.0" y="229.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">slower</text>
<text x="1280.0" y="229.0" font-size="11" fill="#555" text-anchor="middle">slower</text>
</svg>