<text x="436.0" y="293.0" font-size="11" fill="#555" text-anchor="middle">compensation URIs</text>
<text x="330" y="42" font-size="11" fill="#888" text-anchor="middle" font-weight="700">A saga is a state machine — something has to hold where it is</text>
<text x="520" y="405" font-size="11" fill="#888" text-anchor="middle">InMemorySagaService keeps this in the JVM heap: a crash mid-saga loses it, so nothing compensates.</text>
<text x="520" y="423" font-size="11" fill="#888" text-anchor="middle">An LRA coordinator (camel-lra + Narayana) persists it — and the Camel service goes back to stateless.</text>
