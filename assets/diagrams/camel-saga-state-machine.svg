<text x="840.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">  (the ids a refund/undo needs)</text>
<text x="840.0" y="272.5" font-size="11.5" fill="#555555" text-anchor="middle">• status + which step is next</text>
<text x="840.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">• timeout deadline</text>
