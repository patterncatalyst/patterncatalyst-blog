<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="92" width="150" height="64" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="95.0" y="122.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Deploy dark</text>
<text x="95.0" y="139.0" font-size="11.5" fill="#555555" text-anchor="middle">flag off</text>
<rect x="205" y="92" width="140" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="275.0" y="122.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Release 1%</text>
<text x="275.0" y="139.0" font-size="11.5" fill="#555555" text-anchor="middle">flag on, cohort</text>
<rect x="380" y="92" width="140" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="450.0" y="122.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Ramp the %</text>
<text x="450.0" y="139.0" font-size="11.5" fill="#555555" text-anchor="middle">10, 50, ...</text>
<rect x="555" y="92" width="140" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="625.0" y="129.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">GA 100%</text>
<rect x="730" y="92" width="150" height="64" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="805.0" y="129.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Retire the flag</text>
<path d="M170,124 L205,124" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="193.5" y="118.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">flag flip</text>
<text x="193.5" y="118.0" font-size="11" fill="#b8650a" text-anchor="middle">flag flip</text>
<path d="M345,124 L380,124" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M520,124 L555,124" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M695,124 L730,124" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="32" font-size="15" fill="#888" text-anchor="middle" font-weight="700">Deploy ships the code; release is a flag flip, and so is rollback</text>
<text x="450" y="200" font-size="11" fill="#64748b" text-anchor="middle">rollback = narrow the flag, never a new deploy</text>
</svg>